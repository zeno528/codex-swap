name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Run tests (pwsh, Windows 分支)
        shell: pwsh
        run: ./windows/tests/test_codex-switch.ps1

  test-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Bash syntax check (Linux 分支)
        run: |
          bash -n linux/codex-switch
          bash -n linux/install.sh
          bash -n linux/uninstall.sh
          bash -n scripts/verify-release.sh
      - name: 校验双分支版本同步
        run: scripts/verify-release.sh
      - name: Linux 分支端到端切换测试（隔离 CODEX_HOME）
        run: scripts/test-linux.sh
