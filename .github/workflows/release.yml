name: release

on:
  push:
    branches: [main]
    paths: [VERSION]

permissions:
  contents: write

jobs:
  test-windows-5-1:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Run tests (PowerShell 5.1, Windows 分支)
        shell: powershell
        run: ./windows/tests/test_codex-swap.ps1

  test-windows-7:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Run tests (PowerShell 7, Windows 分支)
        shell: pwsh
        run: ./windows/tests/test_codex-swap.ps1

  test-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Bash syntax check and version validation
        run: |
          bash -n linux/codex-swap
          bash -n linux/install.sh
          bash -n linux/uninstall.sh
          bash -n scripts/verify-release.sh
          bash -n scripts/test-linux.sh
          bash -n scripts/build.sh
          scripts/verify-release.sh "v$(tr -d '[:space:]' < VERSION)"
      - name: Linux 分支端到端切换测试
        run: scripts/test-linux.sh

  test-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Bash syntax check (macOS 分支)
        run: |
          bash -n linux/codex-swap
          bash -n linux/install.sh
          bash -n linux/uninstall.sh
          bash -n scripts/test-linux.sh
      - name: macOS 分支端到端切换测试
        run: scripts/test-linux.sh

  create-release:
    needs: [test-windows-5-1, test-windows-7, test-linux, test-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Build release zips (注入 VERSION)
        run: scripts/build.sh --package
      - name: Verify release packages
        run: scripts/verify-release.sh "v$(tr -d '[:space:]' < VERSION)" codex-swap-windows.zip codex-swap-linux-macos.zip
      - name: Generate release notes (commit 列表)
        run: |
          tag="v$(tr -d '[:space:]' < VERSION)"
          prev="$(git tag --sort=-v:refname | head -1 || true)"
          {
            echo "## 更新内容"
            if [ -n "$prev" ] && git merge-base --is-ancestor "$prev" HEAD 2>/dev/null; then
              git log --format='- %s' "${prev}..HEAD"
              echo ""
              echo "**Full Changelog**: https://github.com/${GITHUB_REPOSITORY}/compare/${prev}...${tag}"
            else
              git log --format='- %s'
            fi
          } > NOTES.md
          cat NOTES.md
      - name: Create GitHub Release
        run: |
          tag="v$(tr -d '[:space:]' < VERSION)"
          gh release create "$tag" codex-swap-windows.zip codex-swap-linux-macos.zip --target "$GITHUB_SHA" --title "$tag" --notes-file NOTES.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Prune old releases (仅保留最新 5 个)
        run: |
          # 发行版界面最多保留最新 5 个 release：新版本发布时，第 6 个及更早的旧 release 被删除（tag 保留）
          gh release list --limit 100 \
            --json tagName,publishedAt \
            --jq '[.[] | select(.publishedAt != null)] | sort_by(.publishedAt) | reverse | .[5:][] | .tagName' \
            | while read -r old_tag; do
                echo "  删除旧 Release: $old_tag"
                gh release delete "$old_tag" --yes
              done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
